<!doctype html>
<html lang="__OKF_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Graph explorer</title>
<style>
  :root {
    color-scheme: light dark;
    --hud-font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --hud-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --stage-bg: light-dark(#faf8f8, #161618);
    --stage-fg: light-dark(#2b2b2b, #d4d4d4);
    --hud-bg: light-dark(#ffffff, #1d1d21);
    --hud-bg-glass: light-dark(rgba(255, 255, 255, .74), rgba(29, 29, 33, .74));
    --hud-border: light-dark(#dfe2e8, #35363d);
    --hud-shadow: light-dark(0 6px 24px rgba(20, 24, 32, .12), 0 8px 28px rgba(0, 0, 0, .45));
    --hud-fg: light-dark(#1f2328, #ececf0);
    --hud-fg-2: light-dark(#5b626d, #a3a7b0);
    --hud-fg-3: light-dark(#8b919b, #6f737c);
    --hud-active: light-dark(#eaeef4, #2b2d35);
    --hud-hover: light-dark(#f2f4f8, #25272e);
    --accent: light-dark(#2f6fb8, #8db4ec);
    --accent-soft: light-dark(rgba(47, 111, 184, .12), rgba(141, 180, 236, .16));
    --warn: light-dark(#b45309, #f4b860);
    --hud-radius: 12px;
    --hud-motion: cubic-bezier(.16, 1, .3, 1);
  }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.45 var(--hud-font); background: var(--stage-bg); color: var(--stage-fg);
         overflow: hidden;
         /* Dentro del modal esto va en un iframe: sin contener el rebase, Firefox
            encadena la rueda a la página de detrás y el fondo se mueve al hacer zoom. */
         overscroll-behavior: none; }
  button { font: inherit; }
  [hidden] { display: none !important; }

  #stage { position: relative; width: 100%; height: 100%; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  canvas.on-node { cursor: pointer; }
  canvas.dragging { cursor: grabbing; }

  /* Todo el chrome flota sobre el lienzo. Las capas no capturan el puntero; solo las islas. */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  .island { pointer-events: auto; background: var(--hud-bg); border: 1px solid var(--hud-border);
            border-radius: var(--hud-radius); box-shadow: var(--hud-shadow); color: var(--hud-fg); }
  body[data-surfaces="glass"] .island { background: var(--hud-bg-glass);
            -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); }
  @media (prefers-reduced-transparency: reduce) {
    body[data-surfaces="glass"] .island { background: var(--hud-bg); -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  .dot { display: inline-block; width: .6em; height: .6em; border-radius: 50%; flex: 0 0 auto; }
  .badge { display: inline-block; padding: 0 .4em; border-radius: 999px; font-size: .68rem; line-height: 1.5;
           background: var(--hud-active); border: 1px dashed var(--hud-border); color: var(--hud-fg-2); white-space: nowrap; }
  .icon { border: 0; background: none; color: var(--hud-fg-3); cursor: pointer; padding: .15rem .4rem; border-radius: 7px; line-height: 1.2; }
  .icon:hover { background: var(--hud-hover); color: var(--hud-fg); }

  /* ---- puertas a otros grafos: pegadas al portal en el lienzo y como chips ---- */
  #portals { position: absolute; inset: 0; pointer-events: none; z-index: 15; }
  .portal-btn { position: absolute; pointer-events: auto; display: inline-flex; align-items: center;
                padding: .12rem .5rem; border-radius: 999px; border: 1px solid var(--accent);
                background: var(--hud-bg); color: var(--accent); font: 600 .72rem/1.5 var(--hud-font);
                cursor: pointer; box-shadow: var(--hud-shadow); white-space: nowrap;
                transition: background .15s var(--hud-motion), color .15s var(--hud-motion); }
  .portal-btn:hover { background: var(--accent); color: var(--hud-bg); }
  .chip.door { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip.door:hover { background: var(--accent-soft); color: var(--accent); }

  /* ---- arriba, centrado: omnibar, resultados, cápsula de selección ---- */
  #top { position: absolute; top: .8rem; left: 50%; transform: translateX(-50%);
         width: min(40rem, calc(100% - 1.6rem)); display: flex; flex-direction: column; gap: .45rem; z-index: 20;
         transition: left .25s var(--hud-motion), width .25s var(--hud-motion); }
  /* Con el dock abierto la omnibar se centra en lo que queda de lienzo, no debajo del dock. */
  body.dock-open #top { left: 29%; width: min(40rem, calc(58% - 1.6rem)); }
  #omnibar { display: flex; align-items: center; gap: .3rem; padding: .3rem .4rem .3rem .45rem;
             transition: border-color .15s var(--hud-motion), box-shadow .15s var(--hud-motion); }
  #omnibar:focus-within { border-color: var(--accent); box-shadow: var(--hud-shadow), 0 0 0 3px var(--accent-soft); }
  #trail { display: flex; align-items: center; gap: .1rem; flex: 0 1 auto; min-width: 0; max-width: 58%;
           font-size: .82rem; white-space: nowrap; }
  /* Los ancestros ceden antes que el nivel actual: lo que importa es dónde se está. */
  #trail .lvl { border: 0; background: none; color: var(--hud-fg-2); padding: .12rem .35rem; border-radius: 7px;
                cursor: pointer; flex: 0 4 auto; min-width: 2.6rem; overflow: hidden; text-overflow: ellipsis; }
  #trail .lvl:hover { background: var(--hud-hover); color: var(--hud-fg); }
  #trail .cur { font-weight: 650; color: var(--hud-fg); padding: .12rem .35rem; flex: 0 1 auto; min-width: 6rem;
                overflow: hidden; text-overflow: ellipsis; }
  #trail .sep { color: var(--hud-fg-3); }
  #trail .scope { flex: 0 0 auto; margin-left: .2rem; font: 600 .68rem/1.6 var(--hud-mono); letter-spacing: .02em;
                  border: 1px solid var(--hud-border); border-radius: 999px; padding: 0 .45rem;
                  background: transparent; color: var(--hud-fg-2); cursor: pointer; }
  #trail .scope:hover { background: var(--hud-hover); }
  #trail .scope.active { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  #q { flex: 1; min-width: 5rem; border: 0; background: transparent; color: inherit; font: inherit;
       font-size: .9rem; padding: .25rem .3rem; outline: none; }
  #q::placeholder { color: var(--hud-fg-3); }
  #q::-webkit-search-cancel-button { display: none; }

  #results { max-height: min(22rem, 50vh); overflow-y: auto; overscroll-behavior: contain; padding: .3rem; }
  #results .hd { font-size: .72rem; color: var(--hud-fg-3); padding: .25rem .55rem; }
  #results .hd.warn { color: var(--warn); }
  #results .row { display: flex; align-items: baseline; gap: .45rem; width: 100%; padding: .32rem .55rem;
                  border: 0; background: none; color: inherit; font-size: .84rem; text-align: left;
                  border-radius: 8px; cursor: pointer; }
  #results .row:hover, #results .row.hi { background: var(--hud-active); }
  #results .row .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #results .row .kind { margin-left: auto; font-size: .72rem; color: var(--hud-fg-3); white-space: nowrap; }

  #sel { padding: .45rem .65rem; font-size: .82rem; line-height: 1.55; max-height: 30vh; overflow-y: auto; overscroll-behavior: contain; }
  #sel .hd { display: flex; align-items: center; gap: .45rem; }
  #sel .hd .ttl { font-weight: 700; flex: 1; min-width: 0; }
  #sel .chip { flex: 0 0 auto; }
  #sel .grp { color: var(--hud-fg-2); }
  #sel .grp b { color: var(--hud-fg); font-weight: 600; }
  #sel .grp a { color: var(--accent); text-decoration: none; cursor: pointer; }
  #sel .grp a:hover { text-decoration: underline; }
  #sel .sep { color: var(--hud-fg-3); margin: 0 .35rem; }

  /* ---- abajo a la izquierda: pila de islas ---- */
  #stack { position: absolute; left: .8rem; bottom: .8rem; width: 17rem; max-height: calc(100% - 1.6rem);
           display: flex; flex-direction: column; justify-content: flex-end; gap: .5rem; z-index: 20; }
  #brand { display: flex; align-items: center; gap: .5rem; padding: .45rem .7rem; }
  #brand b { font-size: .88rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #brand a { color: var(--hud-fg-2); text-decoration: none; font-size: .78rem; white-space: nowrap; }
  #brand a:hover { color: var(--accent); }
  body.framed #brand a { display: none; }
  #views, #filters { padding: .45rem .5rem; display: flex; flex-direction: column; gap: .35rem; }
  #views { max-height: 40vh; overflow-y: auto; overscroll-behavior: contain; }
  .chips { display: flex; flex-wrap: wrap; gap: .25rem; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: .35rem; padding: .18rem .55rem; border-radius: 999px;
          border: 1px solid var(--hud-border); background: transparent; color: var(--hud-fg-2);
          font-size: .78rem; cursor: pointer; max-width: 100%;
          transition: background .15s var(--hud-motion), border-color .15s var(--hud-motion); }
  .chip:hover { background: var(--hud-hover); color: var(--hud-fg); }
  .chip[aria-pressed="true"] { background: var(--hud-active); border-color: transparent; color: var(--hud-fg); font-weight: 600; }
  .chip .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .sub { font: 600 .68rem/1 var(--hud-mono); color: var(--hud-fg-3); }
  .chip.warn .sub { color: var(--warn); }
  .chip .arr { color: var(--hud-fg-3); }
  .chip.mini { padding: .08rem .45rem; font-size: .72rem; }
  #desc { font-size: .76rem; line-height: 1.45; color: var(--hud-fg-2); padding: .1rem .25rem 0; }
  #desc b { color: var(--hud-fg); }
  #desc code { font-size: .95em; }
  #filters .foot { display: flex; align-items: center; gap: .3rem; font-size: .72rem; color: var(--hud-fg-3); padding: 0 .2rem; }
  #filters .foot #stats { flex: 1; font-family: var(--hud-mono); }

  /* ---- menú lateral de tipos / relaciones ---- */
  #side { position: absolute; left: calc(17rem + 1.4rem); bottom: .8rem; width: 16rem;
          max-height: min(60vh, calc(100% - 1.6rem)); display: flex; flex-direction: column; z-index: 30; }
  #side .hd { display: flex; align-items: center; gap: .3rem; padding: .4rem .5rem .4rem .7rem;
              border-bottom: 1px solid var(--hud-border); font-size: .8rem; font-weight: 650; }
  #side .hd .sp { flex: 1; }
  #side .rows { overflow-y: auto; overscroll-behavior: contain; padding: .3rem; }
  #side label.row { display: flex; align-items: center; gap: .45rem; padding: .28rem .45rem; border-radius: 8px;
                    cursor: pointer; font-size: .8rem; user-select: none; }
  #side label.row:hover { background: var(--hud-hover); }
  #side label.row input { margin: 0; accent-color: var(--accent); }
  #side label.row .lb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #side label.row.off .lb { color: var(--hud-fg-3); }
  #side label.row .cnt { font: .7rem/1 var(--hud-mono); color: var(--hud-fg-3); }
  #side .lg { border-top: 1px solid var(--hud-border); padding: .4rem .7rem .5rem; font-size: .76rem;
              color: var(--hud-fg-2); display: flex; flex-direction: column; gap: .15rem; }
  #side .lg .lt { font-weight: 650; color: var(--hud-fg); }
  #side .lg span { display: flex; align-items: center; gap: .35rem; }

  /* ---- dock de lectura: flota a la derecha, no estrecha el lienzo ---- */
  #dock { position: absolute; top: .8rem; right: .8rem; bottom: .8rem; width: min(42%, 46rem); min-width: 22rem;
          display: flex; flex-direction: column; overflow: hidden; z-index: 25; }
  #dock header { display: flex; align-items: stretch; gap: .4rem; padding: .35rem .5rem;
                 border-bottom: 1px solid var(--hud-border); min-height: 2.1rem; }
  #dock .tabs { display: flex; gap: .25rem; overflow-x: auto; overscroll-behavior: contain; flex: 1; min-width: 0; scrollbar-width: thin; }
  #dock .tab { display: flex; align-items: center; gap: .35rem; padding: .2rem .5rem; border-radius: 7px; cursor: pointer;
               font-size: .8rem; max-width: 14rem; border: 1px solid transparent; color: var(--hud-fg-2);
               white-space: nowrap; flex: 0 0 auto; }
  #dock .tab:hover { background: var(--hud-hover); }
  #dock .tab.active { background: var(--hud-active); border-color: var(--hud-border); color: var(--hud-fg); font-weight: 600; }
  #dock .tab .nm { overflow: hidden; text-overflow: ellipsis; }
  #dock .tab.temp .nm { font-style: italic; }
  #dock .tab .pin { opacity: .35; font-size: .85em; padding: 0 .1rem; border-radius: 4px; }
  #dock .tab .pin:hover { opacity: 1; background: var(--hud-active); }
  #dock .tab.pinned .pin { opacity: .9; }
  #dock .tab .x { opacity: .5; font-size: .9em; padding: 0 .1rem; border-radius: 4px; }
  #dock .tab .x:hover { opacity: 1; background: var(--hud-active); }
  #dock .tab .tdot { width: .55em; height: .55em; border-radius: 50%; flex: 0 0 auto; }
  #dock .acts { display: flex; gap: .3rem; align-items: center; flex: 0 0 auto; }
  #dock .frames { position: relative; flex: 1; min-height: 0; }
  /* Una sola regla para los iframes: se fija width/height además de la posición para no
     depender de cómo se resuelva `inset` en un elemento reemplazado. */
  #dock .frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; display: none; }
  #dock .frames iframe.active { display: block; }

  #tip { position: absolute; pointer-events: none; z-index: 50; background: var(--hud-bg);
         border: 1px solid var(--hud-border); border-radius: 8px; padding: .45rem .65rem;
         font-size: .85rem; box-shadow: var(--hud-shadow); display: none; max-width: 340px; color: var(--hud-fg); }
  #tip b { color: var(--hud-fg); }
  #tip small { color: var(--hud-fg-2); }
  #tip .pv { margin-top: .3rem; padding-top: .3rem; border-top: 1px solid var(--hud-border);
             font-size: .78rem; line-height: 1.35; color: var(--hud-fg-2); }

  @media (max-width: 900px) {
    #top, body.dock-open #top { left: 50%; width: calc(100% - 1rem); top: .5rem; }
    /* En estrecho la miga va en su propia línea y la caja de búsqueda debajo, a todo el ancho. */
    #omnibar { flex-wrap: wrap; }
    #trail { max-width: 100%; flex: 1 1 100%; }
    #q { flex: 1 1 auto; }
    #stack { width: calc(100% - 1.6rem); }
    #side { left: .8rem; right: .8rem; width: auto; bottom: auto; top: 3.6rem; max-height: 50vh; }
    #dock { inset: 0; width: auto; min-width: 0; border-radius: 0; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="portals"></div>
    <div id="top">
      <div id="omnibar" class="island">
        <nav id="trail"></nav>
        <input id="q" type="search" autocomplete="off" spellcheck="false">
        <button id="q-clear" class="icon" type="button" hidden>✕</button>
      </div>
      <div id="results" class="island" hidden></div>
      <div id="sel" class="island" hidden></div>
    </div>
    <aside id="stack">
      <section id="brand" class="island"><b id="ptitle"></b><a id="pback" href="/"></a></section>
      <section id="views" class="island" hidden>
        <div class="chips" id="doors" hidden></div>
        <div class="chips" id="mode"></div>
        <div id="desc" hidden></div>
      </section>
      <section id="filters" class="island" hidden>
        <div class="chips">
          <button class="chip" id="f-types" type="button"><span class="tx"></span><span class="sub"></span><span class="arr">›</span></button>
          <button class="chip" id="f-edges" type="button"><span class="tx"></span><span class="sub"></span><span class="arr">›</span></button>
        </div>
        <div class="foot">
          <span id="stats"></span>
          <button class="chip mini" id="fit" type="button"></button>
          <button class="chip mini" id="reset" type="button"></button>
        </div>
      </section>
    </aside>
    <div id="side" class="island" hidden></div>
    <aside id="dock" class="island" hidden>
      <header>
        <div class="tabs" role="tablist"></div>
        <span class="acts">
          <button class="chip mini" id="peek-dive" type="button" hidden></button>
          <a class="chip mini" id="peek-open" href="#" target="_blank" rel="noopener"></a>
          <button class="icon" id="peek-close" type="button">✕</button>
        </span>
      </header>
      <div class="frames"></div>
    </aside>
    <div id="tip"></div>
  </div>
</div>

<script src="/static/d3.v7.9.0.min.js"></script>
<script>
var OKF_EXPLORER_CONFIG = __OKF_EXPLORER_CONFIG__;
__OKF_EXPLORER_HUD__
</script>
</body>
</html>
